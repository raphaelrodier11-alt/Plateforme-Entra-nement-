name: Réinitialiser le lien secret

# À lancer à la main si le lien secret est perdu ou a fuité : l'ancien lien
# cesse de fonctionner et l'app propose d'en créer un nouveau à la prochaine
# ouverture. Les données sont conservées.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Écris OUI pour confirmer'
        required: true

permissions:
  contents: read

jobs:
  reinitialiser:
    name: Réinitialisation
    if: inputs.confirmation == 'OUI'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Préparer l'adresse de l'app et la clé
        run: ./scripts/contexte-actions.sh avec-adresse
      - name: Réinitialiser l'accès
        run: |
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $PIPELINE_KEY" "$APP_URL/api/admin/reinitialiser-acces"
          echo "::notice::Lien secret réinitialisé : ouvre l'app pour en créer un nouveau."
