<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dr Rodier" />
    <link rel="icon" type="image/svg+xml" href="/icone.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dr-rodier:theme') || 'sombre';
          var clair = t === 'clair' || (t === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = clair ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
    <title>Dr Rodier</title>
  </head>
  <body>
    <div id="racine"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
